services:
  users-db:
    image: postgres:latest
    container_name: users-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - users_db_data:/var/lib/postgresql
    networks:
      - users-service-network

  products-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: products-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - products_db_data:/var/opt/mssql
    networks:
      - products-service-network

  orders-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orders-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - orders_db_data:/var/opt/mssql
    networks:
      - orders-service-network

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - ecommerce-network

  users-service:
    build:
      context: ./eCommerceSolution.UsersService
      dockerfile: UsersMicroservice.API/Dockerfile
    container_name: users-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=users-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__SecurityKey=${JWT_SECURITY_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpirationTime=${JWT_EXPIRATION_TIME}
      - RefreshToken__ExpirationTime=${REFRESH_TOKEN_EXPIRATION_TIME}
      - SeedAdmin__Email=${SEED_ADMIN_EMAIL}
      - SeedAdmin__Password=${SEED_ADMIN_PASSWORD}
      - BlobStorage__ConnectionString=${BLOB_STORAGE_CONNECTION_STRING}
      - EmailSettings__Host=${EMAIL_HOST}
      - EmailSettings__Port=${EMAIL_PORT}
      - EmailSettings__Username=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__SenderEmail=${EMAIL_SENDER_EMAIL}
      - EmailSettings__SenderName=${EMAIL_SENDER_NAME}
      - EmailSettings__EnableSsl=${EMAIL_ENABLE_SSL}
      - AuthSettings__EmailConfirmationUrl=${AUTH_EMAIL_CONFIRMATION_URL}
      - AuthSettings__PasswordResetUrl=${AUTH_PASSWORD_RESET_URL}
      - Serilog__WriteTo__1__Args__serverUrl=${SEQ_SERVER_URL}
    ports:
      - "7009:8080"
    depends_on:
      - users-db
      - seq
    networks:
      - users-service-network
      - ecommerce-network

  products-service:
    build:
      context: ./eCommerceSolution.ProductsService
      dockerfile: ProductsMicroService.API/Dockerfile
    container_name: products-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=products-db,1433;Database=${PRODUCTS_DB};User Id=${USER_ID};Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__SecurityKey=${JWT_SECURITY_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpirationTime=${JWT_EXPIRATION_TIME}
      - BlobStorage__ConnectionString=${BLOB_STORAGE_CONNECTION_STRING}
      - Serilog__WriteTo__1__Args__serverUrl=${SEQ_SERVER_URL}
    ports:
      - "7277:8080"
    depends_on:
      - products-db
      - seq
    networks:
      - products-service-network
      - ecommerce-network

  orders-service:
    build:
      context: ./eCommerceSolution.OrdersService
      dockerfile: OrdersMicroservice.API/Dockerfile
    container_name: orders-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=orders-db,1433;Database=${ORDERS_DB};User Id=${USER_ID};Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__SecurityKey=${JWT_SECURITY_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpirationTime=${JWT_EXPIRATION_TIME}
      - UserService__BaseUrl=http://users-service:8080/
      - ProductService__BaseUrl=http://products-service:8080/
      - Serilog__WriteTo__1__Args__serverUrl=${SEQ_SERVER_URL}
    ports:
      - "7010:8080"
    depends_on:
      - orders-db
      - users-service
      - products-service
      - seq
    networks:
      - orders-service-network
      - ecommerce-network

volumes:
  users_db_data:
  products_db_data:
  orders_db_data:
  seq_data:

networks:
  orders-service-network:
    driver: bridge
  products-service-network:
    driver: bridge
  users-service-network:
    driver: bridge
  ecommerce-network:
    driver: bridge
